<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Snake</title>
<style>
  :root {
    --bg: #05070f;
    --neon: #3ef2a1;
    --neon2: #4ad9ff;
    --text: #e8f4ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #101a33 0%, #05070f 60%);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    display: flex; flex-direction: column; gap: 14px;
    padding: 16px; align-items: center;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 18px;
  }
  h1 {
    font-size: clamp(13px, 2.6vw, 19px);
    letter-spacing: .35em; font-weight: 700;
    color: var(--neon);
    text-shadow: 0 0 12px rgba(62, 242, 161, .7);
    white-space: nowrap;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 62px; }
  .stat.right { align-items: flex-end; }
  .stat span { font-size: 9px; letter-spacing: .2em; opacity: .5; }
  .stat strong {
    font-size: clamp(16px, 3vw, 22px);
    font-variant-numeric: tabular-nums;
    color: var(--neon);
    text-shadow: 0 0 10px rgba(62, 242, 161, .6);
  }
  .stat.right strong {
    color: var(--neon2);
    text-shadow: 0 0 10px rgba(74, 217, 255, .6);
  }
  .stage { position: relative; line-height: 0; }
  canvas {
    display: block; border-radius: 12px;
    background: #080b14;
    box-shadow:
      0 0 0 1px rgba(90, 140, 220, .18),
      0 0 40px rgba(40, 120, 255, .12),
      0 20px 60px rgba(0, 0, 0, .6);
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 12px;
    background: rgba(5, 8, 16, .82);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; text-align: center; padding: 20px;
    transition: opacity .18s ease, visibility .18s;
  }
  .overlay.hide { opacity: 0; visibility: hidden; }
  .overlay h2 {
    font-size: clamp(17px, 4vw, 26px); letter-spacing: .12em;
    color: var(--neon);
    text-shadow: 0 0 18px rgba(62, 242, 161, .75);
  }
  .overlay p {
    font-size: clamp(10px, 2.2vw, 12px);
    opacity: .6; line-height: 1.8; letter-spacing: .06em;
  }
  .overlay b { color: var(--neon2); }
  .overlay button {
    margin-top: 6px; font: inherit; font-size: 12px;
    letter-spacing: .22em; font-weight: 700;
    padding: 11px 26px; border-radius: 999px; cursor: pointer;
    color: #04160e; background: var(--neon); border: 0;
    box-shadow: 0 0 22px rgba(62, 242, 161, .55);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .overlay button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 34px rgba(62, 242, 161, .85);
  }
  .overlay button:active { transform: translateY(1px); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
    <h1>NEON SNAKE</h1>
    <div class="stat right"><span>BEST</span><strong id="best">0</strong></div>
  </header>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">NEON SNAKE</h2>
      <p id="ovText">Arrows or WASD to move<br>Space to pause</p>
      <button id="ovBtn">PLAY</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');

  // ---------------------------------------------------------------- config
  const COLS = 21;
  const ROWS = 21;
  const DIRS = {
    up:    { x:  0, y: -1 },
    down:  { x:  0, y:  1 },
    left:  { x: -1, y:  0 },
    right: { x:  1, y:  0 }
  };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const STORAGE_KEY = 'neon-snake-best';

  let CELL = 24;
  let W = 0, H = 0;

  // ---------------------------------------------------------------- state
  let state = 'menu';           // menu | playing | paused | dead
  let snake, dirName, queue, food, score, best, newBest;
  let stepMs, acc, pulse, shake, flash;
  let particles = [];

  best = Number(localStorage.getItem(STORAGE_KEY) || 0) || 0;
  bestEl.textContent = best;

  // ---------------------------------------------------------------- sizing
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const availW = Math.min(window.innerWidth - 48, 560);
    const availH = window.innerHeight - 140;

    CELL = Math.max(10, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    W = CELL * COLS;
    H = CELL * ROWS;

    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------------------------------------------------------------- setup
  function reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);

    snake = [
      { x: cx,     y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    dirName = 'right';
    queue = [];
    score = 0;
    newBest = false;
    stepMs = 135;
    acc = 0;
    pulse = 0;
    shake = 0;
    flash = 0;
    particles.length = 0;

    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.y * COLS + s.x));
    const free = [];
    for (let i = 0; i < COLS * ROWS; i++) {
      if (!occupied.has(i)) free.push(i);
    }
    if (!free.length) { food = null; return; }
    const idx = free[(Math.random() * free.length) | 0];
    food = { x: idx % COLS, y: (idx / COLS) | 0 };
  }

  // ---------------------------------------------------------------- flow
  function start() {
    reset();
    state = 'playing';
    syncUI();
  }

  function toggle() {
    if (state === 'menu' || state === 'dead') {
      start();
    } else if (state === 'playing') {
      state = 'paused';
      syncUI();
    } else if (state === 'paused') {
      state = 'playing';
      acc = 0;
      syncUI();
    }
  }

  function syncUI() {
    if (state === 'playing') {
      overlay.classList.add('hide');
      return;
    }

    overlay.classList.remove('hide');

    if (state === 'menu') {
      ovTitle.textContent = 'NEON SNAKE';
      ovText.innerHTML = 'Arrows or WASD to move<br>Space to pause';
      ovBtn.textContent = 'PLAY';
    } else if (state === 'paused') {
      ovTitle.textContent = 'PAUSED';
      ovText.innerHTML = 'Take a breath';
      ovBtn.textContent = 'RESUME';
    } else if (state === 'dead') {
      ovTitle.textContent = 'GAME OVER';
      ovText.innerHTML = 'You scored <b>' + score + '</b>' +
                         (newBest ? ' &mdash; new best!' : '');
      ovBtn.textContent = 'PLAY AGAIN';
    }
  }

  // ---------------------------------------------------------------- logic
  function step() {
    if (queue.length) {
      const next = queue.shift();
      if (next !== OPPOSITE[dirName]) dirName = next;
    }

    const d = DIRS[dirName];
    const head = { x: snake[0].x + d.x, y: snake[0].y + d.y };

    // walls
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
      return die();
    }
    // self (tail cell is about to move away, so skip the last segment)
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die();
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;

      if (score > best) {
        best = score;
        newBest = true;
        bestEl.textContent = best;
        localStorage.setItem(STORAGE_KEY, best);
      }

      burst(food.x, food.y, 18);
      shake = 7;
      stepMs = Math.max(58, 135 - score * 3.2);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function die() {
    state = 'dead';
    shake = 16;
    flash = 1;
    snake.forEach((s, i) => burst(s.x, s.y, i === 0 ? 20 : 4));
    syncUI();
  }

  // ---------------------------------------------------------------- fx
  function burst(gx, gy, n) {
    for (let i = 0; i < n; i++) {
      const a  = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 200;
      particles.push({
        x: (gx + 0.5) * CELL,
        y: (gy + 0.5) * CELL,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        t: 0,
        dur: 0.45 + Math.random() * 0.55,
        r: 1.5 + Math.random() * 3,
        hue: 140 + Math.random() * 90
      });
    }
  }

  // ---------------------------------------------------------------- update
  function update(dt) {
    pulse += dt * 4;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.dur) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const drag = Math.pow(0.12, dt);
      p.vx *= drag;
      p.vy *= drag;
    }

    shake = shake > 0.1 ? shake * Math.pow(0.0025, dt) : 0;
    flash = flash > 0 ? Math.max(0, flash - dt * 2.2) : 0;

    if (state !== 'playing') return;

    acc += dt * 1000;
    let guard = 0;
    while (acc >= stepMs && state === 'playing' && guard++ < 4) {
      acc -= stepMs;
      step();
    }
  }

  // ---------------------------------------------------------------- draw
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function drawGrid() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(90, 140, 220, 0.07)';
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const x = Math.round(i * CELL) + 0.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let j = 1; j < ROWS; j++) {
      const y = Math.round(j * CELL) + 0.5;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
  }

  function drawFood() {
    if (!food) return;
    const cx = (food.x + 0.5) * CELL;
    const cy = (food.y + 0.5) * CELL;
    const r  = CELL * 0.3 * (1 + Math.sin(pulse) * 0.12);

    ctx.shadowBlur = CELL * 1.4;
    ctx.shadowColor = 'rgba(255, 90, 160, 0.95)';
    ctx.fillStyle = '#ff5aa0';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    const pad  = Math.max(1.1, CELL * 0.08);
    const size = CELL - pad * 2;
    const r    = size * 0.3;
    const n    = snake.length;

    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const t = n > 1 ? i / (n - 1) : 0;
      const hue = 152 + t * 58;
      const x = s.x * CELL + pad;
      const y = s.y * CELL + pad;

      // cheap halo (no shadowBlur -> fast even with long snakes)
      const ext = CELL * 0.16;
      ctx.globalAlpha = 0.14 * (1 - t * 0.6);
      ctx.fillStyle = 'hsl(' + hue + ', 100%, 58%)';
      roundRect(x - ext, y - ext, size + ext * 2, size + ext * 2, r + ext);
      ctx.fill();
      ctx.globalAlpha = 1;

      // core segment
      if (i === 0) {
        ctx.shadowBlur = CELL * 1.2;
        ctx.shadowColor = 'hsla(' + hue + ', 100%, 62%, 0.95)';
      }
      ctx.fillStyle = 'hsl(' + hue + ', ' + (i === 0 ? 100 : 88) + '%, ' +
                      (i === 0 ? 66 : 58 - t * 10) + '%)';
      roundRect(x, y, size, size, r);
      ctx.fill();
      if (i === 0) ctx.shadowBlur = 0;
    }

    // eyes
    const head = snake[0];
    const d = DIRS[dirName];
    const cx = (head.x + 0.5) * CELL;
    const cy = (head.y + 0.5) * CELL;
    const off = CELL * 0.19;
    const fwd = CELL * 0.16;
    const px = -d.y, py = d.x;

    ctx.fillStyle = '#04160e';
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(
        cx + px * off * sgn + d.x * fwd,
        cy + py * off * sgn + d.y * fwd,
        Math.max(1.2, CELL * 0.075),
        0, Math.PI * 2
      );
      ctx.fill();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.t / p.dur;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'hsl(' + p.hue + ', 100%, 65%)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate(
        (Math.random() - 0.5) * shake,
        (Math.random() - 0.5) * shake
      );
    }

    ctx.fillStyle = '#080b14';
    ctx.fillRect(-40, -40, W + 80, H + 80);

    drawGrid();
    drawFood();
    drawSnake();
    drawParticles();

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255, 70, 90, ' + (flash * 0.28) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------------------------------------------------------------- input
  const KEYMAP = {
    arrowup: 'up',    w: 'up',
    arrowdown: 'down', s: 'down',
    arrowleft: 'left', a: 'left',
    arrowright: 'right', d: 'right'
  };

  function pushDir(name) {
    const last = queue.length ? queue[queue.length - 1] : dirName;
    if (name === last || name === OPPOSITE[last]) return;
    if (queue.length < 2) queue.push(name);
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();

    if (KEYMAP[k]) {
      e.preventDefault();
      if (state === 'menu' || state === 'dead') { start(); return; }
      if (state === 'playing') pushDir(KEYMAP[k]);
      return;
    }

    if (k === ' ' || k === 'enter' || k === 'p') {
      e.preventDefault();
      toggle();
    }
  });

  // touch: tap to start, swipe to steer
  let touchStart = null;

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    const wasIdle = state === 'menu' || state === 'dead';
    const isTap = Math.hypot(dx, dy) < 24;

    if (wasIdle) start();
    if (isTap) return;

    if (Math.abs(dx) > Math.abs(dy)) pushDir(dx > 0 ? 'right' : 'left');
    else                             pushDir(dy > 0 ? 'down'  : 'up');
  }, { passive: true });

  ovBtn.addEventListener('click', toggle);

  window.addEventListener('resize', fit);
  window.addEventListener('blur', () => {
    if (state === 'playing') { state = 'paused'; syncUI(); }
  });

  // ---------------------------------------------------------------- loop
  let lastTime = 0;

  function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------- boot
  fit();
  reset();
  syncUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
